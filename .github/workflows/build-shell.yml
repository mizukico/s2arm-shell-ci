name: build-s2arm-shell

# 只编 iOS 壳（含 Metal host），不碰游戏、不需要 prod.keys。
# 产物：out-shell/（root/ + manifest.json），下载后替换 S2Arm 安装目录里的 Shell/。
on:
  workflow_dispatch:
    inputs:
      s2arm_repo:
        description: "S2Arm 仓库"
        required: true
        default: "jhaizhou-ops/S2Arm"
      s2arm_ref:
        description: "S2Arm 的分支 / 提交（要和本机 S2Arm 版本一致，例如 v0.3.4）"
        required: true
        default: "v0.3.4"
      patch_in_repo:
        description: "本仓库里的补丁路径（空 = 不打补丁）"
        required: false
        default: "hostfix/nvn_tbuf_align_v034.patch"
      runner:
        description: "runner 标签（xcode-27 提供 Xcode 27.2 / iOS SDK 27.2）"
        required: true
        default: "xcode-27"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240

    steps:
      - name: Checkout this helper repo
        uses: actions/checkout@v4

      - name: Checkout S2Arm
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.s2arm_repo }}
          ref: ${{ inputs.s2arm_ref }}
          path: s2arm
          fetch-depth: 0          # shell_build.sh 用 git 对象号算壳编号，要完整历史
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain check
        shell: bash
        run: |
          set -euo pipefail
          brew install make meson ninja || true
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          dotnet --version

      - name: Apply patch and align the SDK pin
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          if [ -n "${{ inputs.patch_in_repo }}" ]; then
            git apply -v "$GITHUB_WORKSPACE/${{ inputs.patch_in_repo }}"
          fi
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          PIN="$(awk -F= '$1=="IPHONEOS_SDK_MAJOR"{print $2}' tools/toolchain.env)"
          echo "runner SDK major = $SDK_MAJOR, toolchain.env pins $PIN"
          if [ "$SDK_MAJOR" != "$PIN" ]; then
            # 壳编号按 toolchain.env 算；runner 的 Xcode 大版本不同就改成实际值（自用壳）
            sed -i.bak "s/^IPHONEOS_SDK_MAJOR=.*/IPHONEOS_SDK_MAJOR=$SDK_MAJOR/" tools/toolchain.env
            rm -f tools/toolchain.env.bak
          fi
          # shell_build.sh 要求壳输入表里的文件 git 干净：把补丁与 pin 落成一个提交
          git add -A
          git -c user.name=s2arm-ci -c user.email=ci@local commit -m "ci: host patch + iOS SDK pin ($SDK_MAJOR)" || echo "nothing to commit"

      - name: Assert the rev21b / rev22 edits are in the tree the build compiles
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          F=graphics/nvn/gfx/nvn/nvn_mtl.m
          E=runtime/src/envfile.c
          echo "nvn_mtl.m bytes=$(stat -f%z "$F") sha256=$(shasum -a 256 "$F" | cut -d' ' -f1)"
          echo "envfile.c bytes=$(stat -f%z "$E") sha256=$(shasum -a 256 "$E" | cut -d' ' -f1)"
          echo "vertex call sites=$(grep -c 'cblog_note(pr->sh\[0\], 0)' "$F")"
          echo "out4096=$(grep -c 'char out\[4096\]' "$F")"
          echo "out2048=$(grep -c 'char out\[2048\]' "$F")"
          # git apply succeeding is not the same as the compiler seeing the edit: assert both on the source
          # the build step will compile, so "passed the patch gate" cannot stand in for "is in the binary".
          test "$(grep -c 'cblog_note(pr->sh\[0\], 0)' "$F")" -eq 1
          test "$(grep -c 'char out\[4096\]' "$F")" -eq 1
          test "$(grep -c 'char out\[2048\]' "$F")" -eq 0
          echo "REV21B-SOURCE: PASS"
          # rev22: the env.txt line buffer is 8 KB and the 2 KB one is gone (envfile.c:51), and cblog_note carries
          # exactly one PASSDUMP window gate (nvn_mtl.m:16863). Both facts are asserted on the tree that is built,
          # not on the patch file.
          L8192=$(grep -c 'char line\[8192\];' "$E")
          L2048=$(grep -c 'char line\[2048\];' "$E")
          GATE=$(grep -c 'if (!passdump()) return;' "$F")
          echo "line8192=$L8192 line2048=$L2048 window_gate=$GATE"
          test "$L8192" -eq 1
          test "$L2048" -eq 0
          test "$GATE" -eq 1
          echo "REV22-SOURCE: PASS"

      - name: Regenerate the translation chain header
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          # 改了翻译器（Program.cs / S2A.Dsh 等）就必须重生成链号头：指纹 V 是逐着色器缓存键的一部分，
          # 头不更新则 V 不变、旧译文被复用，改动不生效。
          python3 translator/dmsh_chain.py --header
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=s2arm-ci -c user.email=ci@local commit -m "ci: regenerate translation chain header"
          fi
          git show --stat --oneline HEAD | head -20

      - name: Touch the patched sources so the incremental build really recompiles them
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          # 镜像里的增量构建按 mtime 判新旧；补丁改过的文件若 mtime 不新于既有 .o，改动就不会被编译（S6~S8 疑似踩过）
          git show --name-only --pretty=format: HEAD | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && touch "$f" && echo "touched $f"; done

      - name: Build shell
        shell: bash
        run: |
          set -uo pipefail
          # 挑一个装了 Metal Toolchain 的 Xcode：runner 镜像里可能有更新的 Xcode 但没装 Metal（27.3.0 就是），
          # shell_build.sh 取"装着的 Xcode 里最新的"会直接报红。
          for X in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if DEVELOPER_DIR="$X/Contents/Developer" xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
              export DEVELOPER_DIR="$X/Contents/Developer"
              export S2A_DEVELOPER_DIR="$X/Contents/Developer"   # toolchain.sh 的第一优先级
              echo "使用带 Metal Toolchain 的 Xcode：$X"
              break
            fi
          done
          xcrun -sdk iphoneos metal --version 2>&1 | head -2 || true
          cd s2arm
          # the build deletes its make.log on exit (trap): keep a rolling copy while it runs
          ( while :; do for f in "${RUNNER_TEMP:-/tmp}"/s2a-shell.*/make.log "${TMPDIR:-/tmp}"/s2a-shell.*/make.log /tmp/s2a-shell.*/make.log /var/folders/*/*/T/s2a-shell.*/make.log; do [ -f "$f" ] && cp -f "$f" "$GITHUB_WORKSPACE/make.log.last" 2>/dev/null; done; sleep 1; done ) &
          WPID=$!
          bash pack/shell_build.sh "$GITHUB_WORKSPACE/out-shell"
          RC=$?
          kill "$WPID" 2>/dev/null || true
          exit $RC

      - name: Assert envfile.c was compiled and linked into the shell
        shell: bash
        run: |
          set -euo pipefail
          B="$GITHUB_WORKSPACE/out-shell/root/S2Arm"
          test -f "$B" || { echo "no shell binary at $B"; exit 1; }
          echo "shell binary bytes=$(stat -f%z "$B")"
          # "来源 env.txt" is a format literal that exists only in runtime/src/envfile.c (checked on the historical
          # packages: it appears exactly once in root/S2Arm). Finding it in this run's linked binary proves the file
          # the patch changed is the one that got compiled in -- a prebuilt library would not carry it.
          N=$(LC_ALL=C grep -a -o '来源 env.txt' "$B" | wc -l | tr -d ' ')
          echo "envfile.c literal '来源 env.txt' in the linked binary: $N"
          if [ -f "$GITHUB_WORKSPACE/make.log.last" ]; then
            echo "make.log lines naming envfile.c: $(grep -a -c 'envfile\.c' "$GITHUB_WORKSPACE/make.log.last" || true)"
            grep -a -n 'envfile\.c' "$GITHUB_WORKSPACE/make.log.last" | head -5 || true
          else
            echo "make.log.last absent (the build keeps it only while running)"
          fi
          test "$N" -ge 1
          echo "REV22-ENVFILE: PASS"

      - name: Dump make log on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          found=0
          for f in "$GITHUB_WORKSPACE/make.log.last" "${RUNNER_TEMP:-/tmp}"/s2a-shell.*/make.log "${TMPDIR:-/tmp}"/s2a-shell.*/make.log /tmp/s2a-shell.*/make.log /var/folders/*/*/T/s2a-shell.*/make.log; do
            [ -f "$f" ] || continue
            found=1
            echo "== $f =="
            wc -l "$f" || true
            echo "== error-ish lines =="
            grep -a -n -E 'error:|fatal error|Undefined symbols|ld: |Error [0-9]|【红】|make\[[0-9]+\]: \*\*\*' "$f" | head -80 || true
            echo "== tail 200 =="
            tail -200 "$f"
          done
          [ "$found" = 1 ] || echo "no make.log found (RUNNER_TEMP=${RUNNER_TEMP:-unset})"

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2arm-shell
          path: out-shell
          if-no-files-found: error
          retention-days: 7


  # 打包期崩溃 A/B/C/D 的证据闸门：只跑诊断包相关单测与「zip 逐字节不变」，不编壳、不动上面 shell 的任何一步。
  # 放 CI 的原因：团队手上没有 Mac，macOS 的 clang/Foundation 只有这台 runner 有（Windows 上连 clang 都没有）。
  # 门禁口径：最后一行必须是 DIAG-TESTS: PASS，并且两个 zip sha256 相同。
  diag-tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout this helper repo
        uses: actions/checkout@v4

      - name: Checkout S2Arm
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.s2arm_repo }}
          ref: ${{ inputs.s2arm_ref }}
          path: s2arm
          persist-credentials: false

      - name: Keep the pristine diagzip.m for the byte-identity check
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          git rev-parse HEAD | sed 's/^/base commit: /'
          cp ios/diagzip.m "$RUNNER_TEMP/diagzip.base.m"

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          if [ -n "${{ inputs.patch_in_repo }}" ]; then
            git -c core.autocrlf=false apply --check -v "$GITHUB_WORKSPACE/${{ inputs.patch_in_repo }}"
            git -c core.autocrlf=false apply -v "$GITHUB_WORKSPACE/${{ inputs.patch_in_repo }}"
          fi
          git status --short

      - name: diagzip unit test
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          bash tests/diagzip_test.sh

      - name: diag contract test
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          bash tests/diag_contract_test.sh

      - name: zip is byte-identical before/after the patch
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          W="$(mktemp -d)"
          mkdir -p "$W/fx/logs" "$W/fx/metrickit"
          printf '{"schema": 1}\n' > "$W/fx/manifest.json"
          python3 -c "import sys;open(sys.argv[1],'w').write('诊断包：已生成\n'*5000)" "$W/fx/logs/host.log"
          printf 'crash\n' > "$W/fx/metrickit/崩溃 一.json"
          cat > "$W/main.m" <<'M'
          #import <Foundation/Foundation.h>
          #include "diagzip.h"
          int main(int argc, char **argv) { (void)argc; @autoreleasepool { return s2a_write_zip(@(argv[1]), @(argv[2])) ? 0 : 1; } }
          M
          build() {   # $1 = diagzip.m, $2 = 输出 zip
            clang -fobjc-arc -O1 -I ios -o "$W/z" "$W/main.m" "$1" -framework Foundation -lz
            "$W/z" "$W/fx" "$2"
          }
          build "$RUNNER_TEMP/diagzip.base.m" "$W/before.zip"
          build ios/diagzip.m "$W/after.zip"
          S1="$(shasum -a 256 "$W/before.zip" | awk '{print $1}')"
          S2="$(shasum -a 256 "$W/after.zip" | awk '{print $1}')"
          echo "zip sha256 before (base diagzip.m): $S1  $(stat -f%z "$W/before.zip") B"
          echo "zip sha256 after  (this patch)    : $S2  $(stat -f%z "$W/after.zip") B"
          if [ "$S1" != "$S2" ]; then echo "the added log lines changed the zip bytes"; exit 1; fi
          echo "bytes identical"

      - name: Metal compile check, pristine shader (proves the toolchain accepts this file at all)
        shell: bash
        run: |
          set -euo pipefail
          W="$(mktemp -d)"; cd "$W"
          cp "$GITHUB_WORKSPACE/shaders/39027e0d81129414_b.pristine.metal" p.metal
          echo "pristine bytes=$(stat -f%z p.metal) sha256=$(shasum -a 256 p.metal | cut -d' ' -f1)"
          xcrun -sdk iphoneos metal -c p.metal -o p.air
          echo "pristine compiles: $(stat -f%z p.air) B of AIR"

      - name: Metal compile check, edited shader (the two S2A_FSOUT insertions must be legal)
        shell: bash
        run: |
          set -euo pipefail
          W="$(mktemp -d)"; cd "$W"
          cp "$GITHUB_WORKSPACE/shaders/39027e0d81129414_b.edited.metal" e.metal
          echo "edited bytes=$(stat -f%z e.metal) sha256=$(shasum -a 256 e.metal | cut -d' ' -f1)"
          # 上一版这里翻过车：行中 // 注释把 s2a_alpha_pass 的定义整段吃掉，编译才炸。
          # 定义必须在活代码行上、且只出现一次。
          echo "s2a_alpha_pass definition count: $(grep -c 'static inline bool s2a_alpha_pass' e.metal)"
          test "$(grep -c 'static inline bool s2a_alpha_pass' e.metal)" -eq 1
          echo "S2A_FSOUT_ON occurrences in the edited source: $(grep -c S2A_FSOUT_ON e.metal)"
          xcrun -sdk iphoneos metal -c e.metal -o e.air
          echo "edited compiles: $(stat -f%z e.air) B of AIR"
          echo "METAL-CHECK: PASS"

      - name: Summary line for the gate
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "DIAG-TESTS: PASS"
          else
            echo "DIAG-TESTS: FAIL one of the steps above (see its log; nothing here is a pass by omission)"
          fi
