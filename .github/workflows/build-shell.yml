name: build-s2arm-shell

# 只编 iOS 壳（含 Metal host），不碰游戏、不需要 prod.keys。
# 产物：out-shell/（root/ + manifest.json），下载后替换 S2Arm 安装目录里的 Shell/。
on:
  workflow_dispatch:
    inputs:
      s2arm_repo:
        description: "S2Arm 仓库"
        required: true
        default: "jhaizhou-ops/S2Arm"
      s2arm_ref:
        description: "S2Arm 的分支 / 提交（要和本机 S2Arm 版本一致，例如 v0.3.4）"
        required: true
        default: "v0.3.4"
      patch_in_repo:
        description: "本仓库里的补丁路径（空 = 不打补丁）"
        required: false
        default: "hostfix/nvn_tbuf_align_v034.patch"
      runner:
        description: "runner 标签（xcode-27 提供 Xcode 27.2 / iOS SDK 27.2）"
        required: true
        default: "xcode-27"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240

    steps:
      - name: Checkout this helper repo
        uses: actions/checkout@v4

      - name: Checkout S2Arm
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.s2arm_repo }}
          ref: ${{ inputs.s2arm_ref }}
          path: s2arm
          fetch-depth: 0          # shell_build.sh 用 git 对象号算壳编号，要完整历史
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain check
        shell: bash
        run: |
          set -euo pipefail
          brew install make meson ninja || true
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          dotnet --version

      - name: Apply patch and align the SDK pin
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          if [ -n "${{ inputs.patch_in_repo }}" ]; then
            git apply -v "$GITHUB_WORKSPACE/${{ inputs.patch_in_repo }}"
          fi
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          PIN="$(awk -F= '$1=="IPHONEOS_SDK_MAJOR"{print $2}' tools/toolchain.env)"
          echo "runner SDK major = $SDK_MAJOR, toolchain.env pins $PIN"
          if [ "$SDK_MAJOR" != "$PIN" ]; then
            # 壳编号按 toolchain.env 算；runner 的 Xcode 大版本不同就改成实际值（自用壳）
            sed -i.bak "s/^IPHONEOS_SDK_MAJOR=.*/IPHONEOS_SDK_MAJOR=$SDK_MAJOR/" tools/toolchain.env
            rm -f tools/toolchain.env.bak
          fi
          # shell_build.sh 要求壳输入表里的文件 git 干净：把补丁与 pin 落成一个提交
          git add -A
          git -c user.name=s2arm-ci -c user.email=ci@local commit -m "ci: host patch + iOS SDK pin ($SDK_MAJOR)" || echo "nothing to commit"

      - name: Build shell
        shell: bash
        run: |
          set -euo pipefail
          cd s2arm
          bash pack/shell_build.sh "$GITHUB_WORKSPACE/out-shell"

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2arm-shell
          path: out-shell
          if-no-files-found: error
          retention-days: 7
